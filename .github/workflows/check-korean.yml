name: Check Korean vocabulary app
on:
  push:
    paths: ['korean-app/**', 'korean/**', 'vocabulary.json', 'provenance.json', 'data/raw/manifest.json', '.github/workflows/check-korean.yml']
  pull_request:
    paths: ['korean-app/**', 'korean/**', 'vocabulary.json', 'provenance.json', 'data/raw/manifest.json', '.github/workflows/check-korean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: korean-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: korean-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check committed static output is current
        run: git diff --exit-code -- ../korean
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: korean-test-results
          path: korean-app/test-results/
